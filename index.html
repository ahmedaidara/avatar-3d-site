<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Avatar 3D | Ahmed Said Aidara</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { text-align: center; max-width: 900px; width: 100%; }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: linear-gradient(to right, #00d4ff, #7b2cbf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle { font-size: 1.2rem; color: #cccccc; margin-bottom: 30px; }
    model-viewer {
      width: 100%;
      height: 600px;
      background: transparent;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .info {
      margin-top: 30px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .info h2 { margin-bottom: 10px; color: #00d4ff; }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      background: linear-gradient(45deg, #7b2cbf, #00d4ff);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3);
    }
    #animations {
      margin-top: 20px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    #animations button {
      padding: 10px 18px;
      font-size: 0.95rem;
    }
    .speed-control {
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    footer { margin-top: 40px; font-size: 0.9rem; color: #888; }
    @media (max-width: 600px) {
      model-viewer { height: 450px; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ahmed Said Aidara</h1>
    <p class="subtitle">Avatar 3D interactif • Qingdao</p>

    <model-viewer 
      id="avatar"
      src="https://ahmedaidara.github.io/avatar-3d-site/ton-avatar.glb" 
      alt="Avatar 3D d'Ahmed"
      camera-controls 
      shadow-intensity="1"
      exposure="1"
      environment-image="neutral"
      poster="https://via.placeholder.com/600x800/0f0c29/ffffff?text=Chargement+de+l%27avatar..."
      loading="eager"
      crossorigin="anonymous">
      
      <div slot="progress-bar" style="color: white; font-size: 14px; padding: 10px;">
        Chargement de l'avatar...
      </div>
    </model-viewer>

    <div class="info">
      <h2>Contrôles</h2>
      
      <div class="controls">
        <button onclick="document.getElementById('avatar').cameraOrbit = '0deg 75deg 2.5m'">Face</button>
        <button onclick="document.getElementById('avatar').cameraOrbit = '90deg 75deg 2.5m'">Profil</button>
        <button onclick="document.getElementById('avatar').cameraOrbit = '180deg 75deg 2.5m'">Dos</button>
        <button onclick="document.getElementById('avatar').resetTurntableRotation()">Reset caméra</button>
      </div>

      <div class="speed-control">
        <span>Vitesse :</span>
        <input type="range" id="speed" min="0.2" max="2" step="0.1" value="1">
        <span id="speedValue">1.0x</span>
      </div>

      <div id="animations">
        <p style="color:#aaa;">Chargement des animations...</p>
      </div>
    </div>

    <footer>
      Créé avec Avaturn • Hébergé sur GitHub Pages
    </footer>
  </div>

  <script>
    const viewer = document.querySelector('#avatar');
    const animContainer = document.getElementById('animations');
    const speedSlider = document.getElementById('speed');
    const speedValue = document.getElementById('speedValue');

    speedSlider.addEventListener('input', () => {
      const val = parseFloat(speedSlider.value);
      speedValue.textContent = val.toFixed(1) + 'x';
      if (viewer.animationName) {
        viewer.timeScale = val;
      }
    });

    viewer.addEventListener('load', () => {
      console.log('Avatar chargé');

      const animations = viewer.availableAnimations || [];
      animContainer.innerHTML = '';

      if (animations.length === 0) {
        animContainer.innerHTML = '<p style="color:#ff6b6b;">Aucune animation trouvée dans le GLB.</p>';
        return;
      }

      // Bouton Stop
      const stopBtn = document.createElement('button');
      stopBtn.textContent = '⏹ Stop';
      stopBtn.onclick = () => {
        viewer.pause();
      };
      animContainer.appendChild(stopBtn);

      // Bouton Play / Pause
      const playPauseBtn = document.createElement('button');
      playPauseBtn.textContent = '▶ Play';
      playPauseBtn.onclick = () => {
        if (viewer.paused) {
          viewer.play();
          playPauseBtn.textContent = '⏸ Pause';
        } else {
          viewer.pause();
          playPauseBtn.textContent = '▶ Play';
        }
      };
      animContainer.appendChild(playPauseBtn);

      // Un bouton pour chaque animation
      animations.forEach(name => {
        const btn = document.createElement('button');
        btn.textContent = name;
        btn.onclick = () => {
          viewer.animationName = name;
          viewer.timeScale = parseFloat(speedSlider.value);
          viewer.play();
          playPauseBtn.textContent = '⏸ Pause';
        };
        animContainer.appendChild(btn);
      });
    });

    viewer.addEventListener('error', (e) => {
      console.error('Erreur :', e);
      alert('Impossible de charger l\'avatar.');
    });
  </script>
</body>
</html>
